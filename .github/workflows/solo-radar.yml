name: SOLO Radar — Telegram
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'radar.py'
      - 'telegram_sources.py'
      - 'gpu_assessment.py'
      - 'test_gpu_assessment.py'
      - 'test_telegram_sources.py'
      - '.github/workflows/solo-radar.yml'
permissions:
  contents: write
concurrency:
  group: solo-radar-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test announcement parser
        run: python -m unittest -v test_telegram_sources.py test_gpu_assessment.py
      - name: Check announcements and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS }}
        run: python radar.py
      - name: Remember seen announcements
        run: |
          if [ -f data/state.json ]; then
            git config user.name 'solo-radar-bot'
            git config user.email 'solo-radar-bot@users.noreply.github.com'
            git add data/state.json
            if ! git diff --cached --quiet; then
              git commit -m 'chore: update scan state [skip ci]'
              for attempt in 1 2 3; do
                git fetch origin main
                if ! git rebase -X ours origin/main; then
                  git rebase --abort
                  echo "::warning::Could not rebase state; will retry on next scan"
                  break
                fi
                if git push origin HEAD:main; then
                  echo "Scan state saved"
                  break
                fi
                if [ "$attempt" -eq 3 ]; then
                  echo "::warning::State push conflicted repeatedly; next scan will retry"
                fi
              done
            fi
          fi
