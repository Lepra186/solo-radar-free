name: SOLO Radar — Telegram
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'radar.py'
      - 'pool_validation.py'
      - 'coincalculators_source.py'
      - 'evidence_alerts.py'
      - 'test_evidence_alerts.py'
      - 'test_coincalculators_source.py'
      - 'test_pool_validation.py'
      - 'mineability.py'
      - 'gpu_families.py'
      - 'gpu_readme_evidence.py'
      - 'test_gpu_readme_evidence.py'
      - 'test_gpu_families.py'
      - 'mining_economics.py'
      - 'test_mining_economics.py'
      - 'test_mineability.py'
      - 'network_evidence.py'
      - 'explorer_source.py'
      - 'explorer_progress.py'
      - 'test_explorer_progress.py'
      - 'test_explorer_source.py'
      - 'chain_progress.py'
      - 'bitcointalk_threads.py'
      - 'test_bitcointalk_threads.py'
      - 'test_chain_progress.py'
      - 'test_network_evidence.py'
      - 'github_releases_source.py'
      - 'test_github_releases_source.py'
      - 'discord_sources.py'
      - 'mining_scan_source.py'
      - 'test_extended_sources.py'
      - 'coin_filter.py'
      - 'test_coin_filter.py'
      - 'github_discovery.py'
      - 'project_watch.py'
      - 'test_discovery_watch.py'
      - 'research_agent.py'
      - 'daily_ai.py'
      - 'test_research_agent.py'
      - 'test_daily_ai.py'
      - 'project_facts.py'
      - 'test_project_facts.py'
      - 'cloudflare-worker.mjs'
      - 'test_cloudflare_worker.mjs'
      - 'configure_webhook.py'
      - 'project_links.py'
      - 'test_project_links.py'
      - 'telegram_commands.py'
      - 'telegram_recipients.py'
      - 'test_telegram_recipients.py'
      - 'test_telegram_commands.py'
      - 'telegram_sources.py'
      - 'gpu_assessment.py'
      - 'solo_intel.py'
      - 'test_solo_intel.py'
      - 'test_gpu_assessment.py'
      - 'test_telegram_sources.py'
      - 'test_coin_filter.py'
      - '.github/workflows/solo-radar.yml'
permissions:
  contents: write
concurrency:
  group: solo-radar-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test instant webhook
        run: node --test test_cloudflare_worker.mjs
      - name: Test announcement parser
        run: python -m unittest -v test_telegram_sources.py test_gpu_assessment.py test_solo_intel.py test_telegram_commands.py test_project_links.py test_telegram_recipients.py test_project_facts.py test_research_agent.py test_daily_ai.py test_discovery_watch.py test_coin_filter.py test_extended_sources.py test_github_releases_source.py test_mineability.py test_network_evidence.py test_mining_economics.py test_pool_validation.py test_coincalculators_source.py test_evidence_alerts.py test_gpu_families.py test_gpu_readme_evidence.py test_chain_progress.py test_bitcointalk_threads.py test_explorer_source.py test_explorer_progress.py
      - name: Check announcements and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS }}
        run: python radar.py
      - name: Remember seen announcements
        run: |
          if [ -f data/state.json ]; then
            git config user.name 'solo-radar-bot'
            git config user.email 'solo-radar-bot@users.noreply.github.com'
            git add data/state.json
            if ! git diff --cached --quiet; then
              git commit -m 'chore: update scan state [skip ci]'
              for attempt in 1 2 3; do
                git fetch origin main
                if ! git rebase -X ours origin/main; then
                  git rebase --abort
                  echo "::warning::Could not rebase state; will retry on next scan"
                  break
                fi
                if git push origin HEAD:main; then
                  echo "Scan state saved"
                  break
                fi
                if [ "$attempt" -eq 3 ]; then
                  echo "::warning::State push conflicted repeatedly; next scan will retry"
                fi
              done
            fi
          fi
